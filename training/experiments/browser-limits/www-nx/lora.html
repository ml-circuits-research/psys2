<!doctype html><meta charset=utf-8><title>nx lora</title>
<script type=module>
// NX4-C browser check: the int8 base graph with LoRA as overridable initializers and one .onnx_adapter per world, onnxruntime-web (single thread).
import * as ort from './ort.wasm.bundle.min.mjs';
ort.env.wasm.wasmPaths = new URL('./', location.href).href; ort.env.wasm.numThreads = 1;
const med = (a) => { const s = [...a].sort((x, y) => x - y); return +s[s.length >> 1].toFixed(1); };
const buf = async (u) => new Uint8Array(await (await fetch(u)).arrayBuffer());
const feeds = (ids) => ({ input_ids: new ort.Tensor('int64', BigInt64Array.from(ids, (x) => BigInt(x)), [1, ids.length]), attention_mask: new ort.Tensor('int64', BigInt64Array.from(ids, () => 1n), [1, ids.length]) });
let S = null; const AD = {};
async function time(fn, n = 8) { await fn(); await fn(); const r = []; for (let i = 0; i < n; i++) { const t = performance.now(); await fn(); r.push(performance.now() - t); } return med(r); }
const argmax = (d, o, n) => { let b = 0; for (let i = 1; i < n; i++) if (d[o + i] > d[o + b]) b = i; return b; };
window.run = async (worlds) => {
  const t0 = performance.now(); const b = await buf('models/lora-base.int8.onnx'); const t1 = performance.now();
  S = await ort.InferenceSession.create(b, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
  const out = { baseMB: +(b.length / 1e6).toFixed(1), baseFetchMs: Math.round(t1 - t0), baseCreateMs: Math.round(performance.now() - t1), worlds: {} };
  for (const w of worlds) {
    const ab = await buf(`models/${w}.onnx_adapter`); const ta = performance.now(); AD[w] = await ort.LoraAdapter.create(ab); const createMs = +(performance.now() - ta).toFixed(1);
    const chk = await (await fetch(`models/lora-check-${w}.json`)).json();
    let opOk = 0, tagOk = 0, baseSame = 0;
    for (const c of chk) {
      const r = await S.run(feeds(c.ids), { activeLoraAdapters: [AD[w]] });
      const op = argmax(r.op_logits.data, 0, r.op_logits.dims[1]); if (op === c.op) opOk++;
      const L = r.tag_logits.dims[2]; const tags = c.ids.map((_, k) => argmax(r.tag_logits.data, k * L, L)); if (JSON.stringify(tags) === JSON.stringify(c.tags)) tagOk++;
      const r0 = await S.run(feeds(c.ids)); if (argmax(r0.op_logits.data, 0, r0.op_logits.dims[1]) === c.op_base) baseSame++;
    }
    const f = feeds(Array.from({ length: 32 }, (_, i) => 1000 + (i * 7919) % 28000));
    const noAd = await time(() => S.run(f)); const withAd = await time(() => S.run(f, { activeLoraAdapters: [AD[w]] }));
    out.worlds[w] = { adapterMB: +(ab.length / 1e6).toFixed(2), createMs, n: chk.length, opSameAsPythonAdapter: opOk, tagsSameAsPythonAdapter: tagOk, baseNoAdapterOpSame: baseSame, ms32noAdapter: noAd, ms32withAdapter: withAd };
  }
  if (worlds.length > 1) { const f = feeds(Array.from({ length: 32 }, (_, i) => 1000 + (i * 7919) % 28000)); let k = 0; out.swapMs32 = await time(() => S.run(f, { activeLoraAdapters: [AD[worlds[(k++) % worlds.length]]] })); }
  return out;
};
window.ready = true;
</script>
